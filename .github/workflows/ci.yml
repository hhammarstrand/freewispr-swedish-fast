name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Daily full-install check catches upstream wheel breakage even when
  # nobody pushes (e.g. a new numpy 2.x release breaks faster-whisper).
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC = 06/07:00 Europe/Stockholm

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Primary target is Windows (the app is Windows-only) but we also
        # run on Ubuntu to catch accidental platform-specific imports in
        # the test paths.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Skip torch / faster-whisper / sounddevice in CI: tests/conftest.py
        # stubs them on systems where they're missing. Pulling the real
        # wheels would add ~10 min for zero coverage gain.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyperclip pillow numpy scipy

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        # No autofix in CI; the rule set is intentionally minimal so
        # this is a quality floor, not a style straightjacket.
        run: ruff check .

  smoke-import:
    # Cheap build verification: can every production module be imported
    # without raising? Catches typos and missing imports before the
    # heavier 'build' job runs. ~30 s.
    name: smoke import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight runtime deps
        # Same set as the pytest job — conftest stubs the rest.
        run: |
          python -m pip install --upgrade pip
          pip install pyperclip pillow numpy scipy
      - name: Import every production module
        # Drive imports through conftest's stub setup by pre-loading it.
        # Each module is imported in a fresh subprocess so a failure in
        # one doesn't poison the rest of the report.
        run: |
          set -e
          # Reuse the same stubs the test suite uses
          export PYTHONPATH="$PWD:$PWD/tests"
          for f in *.py; do
            mod="${f%.py}"
            # Skip executable entrypoints that start side-effects on import.
            case "$mod" in
              convert_model|make_icon) continue ;;
            esac
            echo "import $mod"
            python -c "import conftest, importlib; importlib.import_module('$mod')"
          done

  build:
    # Heavyweight check: install the real requirements.txt and import the
    # entrypoint. Catches version-conflict bombs (numpy 2 vs faster-whisper,
    # ctranslate2 wheel availability for new Python versions, etc).
    # Only runs on master + nightly schedule + manual dispatch — too slow
    # for every PR.
    name: full install (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import production modules
        # main.py is the entrypoint; importing it transitively pulls
        # config, transcriber, audio, dictation, ui, model_ui, privacy_ui,
        # llm_polish, snippets, corrections, auto_learn, paste, text_inject,
        # modifiers, sounds. If any wheel is broken this fails loudly.
        shell: bash
        env:
          # Headless Linux: prevent any Toplevel() in import-time code
          # from trying to open an X display. main.py defers Tk() to
          # main() so import alone is safe even without DISPLAY.
          DISPLAY: ""
        run: |
          python -c "import main; print('main.py imported OK')"
          python -c "import model_ui; print('model_ui.py imported OK')"
          python -c "import privacy_ui; print('privacy_ui.py imported OK')"
          python -c "import text_inject; print('text_inject.py imported OK')"

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - name: Audit requirements.txt
        # --strict: any unfixable vulnerability fails the job.
        # If we hit a vuln with no upgrade path we'll add an explicit
        # --ignore-vuln entry with a justification comment.
        run: pip-audit --requirement requirements.txt --strict
